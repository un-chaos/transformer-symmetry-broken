# attn_bias_full.yaml
# The "LEARNED BIAS" ablation. Everything is as in attn_bias_bQbV.yaml (gaussian
# init, fixed resampling, bQ and bV on, bK off, shared across heads and layers,
# embedding bias at zero) EXCEPT bias.attention.learnable: true.
#
# What learnable changes: bQ/bK/bV are no longer fixed buffers drawn once at
# initialisation -- they become trainable nn.Parameter tensors, so the optimizer
# updates them together with the model weights. The run therefore learns *where*
# to break the Q-K / V-O rotational symmetry instead of having it injected at a
# fixed magnitude. Note the config rule: learnable=true requires resample: fixed
# (a parameter that is also redrawn every step would be overwritten), and it is
# rejected for mode: zero (nothing to learn). The gaussian mode here only supplies
# the initialisation distribution; after step 0 the values are whatever training
# makes them.
#
# Use this against attn_bias_bQbV.yaml to separate "a fixed random symmetry
# breaking helps" from "a learned symmetry breaking helps", and against
# bias_zero.yaml for the no-breaking control.
model:
  d_model: 256
  n_heads: 8
  n_encoder_layers: 3
  n_decoder_layers: 3
  d_ff: 1024
  max_seq_len: 64
  dropout: 0.1
  attention_dropout: 0.0
  activation: gelu
  norm_first: false
  scale_embedding: true
  tie_output_embedding: true

bias:
  embed:
    mode: zero
    resample: fixed
    mean: 0.0
    std: 0.02
  attention:
    enabled: true
    # gaussian supplies the initialisation of the trainable tensors.
    mode: gaussian
    # Required by learnable: true.
    resample: fixed
    const_value: 1.0
    # bQ/bK/bV become nn.Parameter instead of fixed buffers.
    learnable: true
    share_across_heads: true
    share_across_layers: true
    apply_encoder: true
    apply_decoder_self: true
    apply_decoder_cross: true
    q_enabled: true
    q_mean: 0.5
    q_std: 0.05
    k_enabled: false
    k_mean: 0.3
    k_std: 0.1
    v_enabled: true
    v_mean: 0.5
    v_std: 0.05
    seed: 1234

data:
  source: hf
  data_dir: data
  hf_repo: bentrevett/multi30k
  hf_endpoint: https://hf-mirror.com
  src_field: de
  tgt_field: en
  max_train_samples: 0
  max_val_samples: 0
  fallback_to_synthetic: true
  tokenizer: word
  lowercase: true
  min_freq: 2
  max_vocab: 30000
  max_src_len: 0
  max_tgt_len: 0

train:
  optimizer: egd
  batch_size: 64
  epochs: 8
  max_steps: 0
  log_every: 50
  eval_every: 250
  max_eval_batches: 20
  bleu_every: 2000
  bleu_samples: 200
  save_dir: runs
  run_name: attn_bias_full
  seed: 42
  device: auto
  num_workers: 0
  egd:
    # lr is tuned for these small CPU models. The reference implementation's
    # lr=1.0 (a 124M-parameter GPT) diverges at this scale; a 150-step sweep
    # on Multi30k measured a stable window of roughly 0.05 - 0.15 (README 5).
    lr: 0.1
    eta: 100.0
    F0: null
    auto_F0_margin: 1.0
    nu: 0.0
    weight_decay: 0.0
    consEn: true
  adamw:
    lr: 3.0e-4
    betas: [0.9, 0.98]
    eps: 1.0e-8
    weight_decay: 0.01
