# bias_zero.yaml
# THE O(1) / ROTATIONALLY-SYMMETRIC CONTROL. With bias.embed.mode: zero the
# embedding bias is exactly b = 0, so the embedding is invariant under a global
# rotation of the d_model feature space and the Q-K sector retains its full
# O(d_model) (per-head O(d_head)) rotation symmetry as an exact symmetry of the
# loss landscape: applying one orthogonal matrix R to every weight matrix of a
# layer leaves the forward pass unchanged. Attention biases are switched off for
# the same reason (enabled: false), so this run has NO deliberate symmetry
# breaking anywhere. Every other bias_* / attn_bias_* preset is measured against
# this one. Sized like small_multi30k so the comparison stays cheap.
model:
  d_model: 256
  n_heads: 8
  n_encoder_layers: 3
  n_decoder_layers: 3
  d_ff: 1024
  max_seq_len: 64
  dropout: 0.1
  attention_dropout: 0.0
  activation: gelu
  norm_first: false
  scale_embedding: true
  tie_output_embedding: true

bias:
  embed:
    # b = 0 in every dimension: no symmetry breaking at all.
    mode: zero
    resample: fixed
    mean: 0.0
    std: 0.02
    const_value: 1.0
    learnable: false
    seed: 1234
  attention:
    # Master switch off: every attention site gets bias None (bQ = bK = bV = 0).
    enabled: false
    mode: zero
    resample: fixed
    learnable: false

data:
  source: hf
  data_dir: data
  hf_repo: bentrevett/multi30k
  hf_endpoint: https://hf-mirror.com
  src_field: de
  tgt_field: en
  max_train_samples: 0
  max_val_samples: 0
  fallback_to_synthetic: true
  tokenizer: word
  lowercase: true
  min_freq: 2
  max_vocab: 30000
  max_src_len: 0
  max_tgt_len: 0

train:
  optimizer: egd
  batch_size: 64
  epochs: 8
  max_steps: 0
  log_every: 50
  eval_every: 250
  max_eval_batches: 20
  bleu_every: 2000
  bleu_samples: 200
  save_dir: runs
  run_name: bias_zero
  seed: 42
  device: auto
  num_workers: 0
  # F0: null means F0 is chosen automatically as initial_loss - auto_F0_margin.
  # A fixed F0 (e.g. 1.0) is safe for cross-entropy because the loss is always
  # positive, but it MUST stay below the smallest loss the model can reach or the
  # update is skipped entirely (the dynamics needs loss - F0 > 0).
  egd:
    # lr is tuned for these small CPU models. The reference implementation's
    # lr=1.0 (a 124M-parameter GPT) diverges at this scale; a 150-step sweep
    # on Multi30k measured a stable window of roughly 0.05 - 0.15 (README 5).
    lr: 0.1
    eta: 100.0
    F0: null
    auto_F0_margin: 1.0
    nu: 0.0
    weight_decay: 0.0
    consEn: true
  adamw:
    lr: 3.0e-4
    betas: [0.9, 0.98]
    eps: 1.0e-8
    weight_decay: 0.01
