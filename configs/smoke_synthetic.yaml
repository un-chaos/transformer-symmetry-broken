# smoke_synthetic.yaml
# Tiny end-to-end verification run on CPU: synthetic "reverse" task, 2+2 layers,
# d_model=64, 30 optimizer steps. Purpose is to prove the whole pipeline (data ->
# tokenizers -> model -> EGD -> eval) imports and runs; it is NOT a real experiment.
# Expected wall clock: well under a minute on CPU.
model:
  d_model: 64
  n_heads: 4
  n_encoder_layers: 2
  n_decoder_layers: 2
  d_ff: 128
  max_seq_len: 16
  dropout: 0.1
  attention_dropout: 0.0
  activation: gelu
  norm_first: false
  scale_embedding: true
  tie_output_embedding: true

# Symmetric control: b = 0 and no attention bias, so the run exercises the code
# path without any deliberate symmetry breaking.
bias:
  embed:
    mode: zero
    resample: fixed
  attention:
    enabled: false
    mode: zero
    resample: fixed

data:
  source: synthetic
  data_dir: data
  synthetic_task: reverse
  synthetic_train_size: 256
  synthetic_val_size: 64
  synthetic_test_size: 64
  synthetic_vocab: 20
  synthetic_len: 8
  synthetic_seed: 1234
  tokenizer: word
  lowercase: true
  min_freq: 1
  max_vocab: 12000
  max_src_len: 0
  max_tgt_len: 0

train:
  optimizer: egd
  batch_size: 32
  epochs: 1
  max_steps: 30
  log_every: 10
  eval_every: 20
  max_eval_batches: 4
  bleu_every: 0
  save_dir: runs
  run_name: smoke_synthetic
  seed: 42
  device: auto
  num_workers: 0
  # F0: null means F0 is chosen automatically as initial_loss - auto_F0_margin.
  # A fixed F0 (e.g. 1.0) is safe for cross-entropy because the loss is always
  # positive, but it MUST stay below the smallest loss the model can reach or the
  # update is skipped entirely (the dynamics needs loss - F0 > 0).
  egd:
    # lr is tuned for these small CPU models. The reference implementation's
    # lr=1.0 (a 124M-parameter GPT) diverges at this scale; a 150-step sweep
    # on Multi30k measured a stable window of roughly 0.05 - 0.15 (README 5).
    lr: 0.1
    eta: 100.0
    F0: null
    auto_F0_margin: 1.0
    nu: 0.0
    weight_decay: 0.0
    consEn: true
  adamw:
    lr: 3.0e-4
    betas: [0.9, 0.98]
    eps: 1.0e-8
    weight_decay: 0.01
