# small_multi30k.yaml
# Middle rung of the Multi30k de->en ladder: d_model=256, 3+3 layers, full 5-epoch
# schedule stretched to 8 epochs, periodic BLEU on a 200-sentence sample. This is
# the size used for the bias-control comparisons (bias_zero / bias_embed_* /
# attn_bias_*), because it is large enough to show a real effect and still cheap.
model:
  d_model: 256
  n_heads: 8
  n_encoder_layers: 3
  n_decoder_layers: 3
  d_ff: 1024
  max_seq_len: 64
  dropout: 0.1
  attention_dropout: 0.0
  activation: gelu
  norm_first: false
  scale_embedding: true
  tie_output_embedding: true

bias:
  embed:
    mode: zero
    resample: fixed
    mean: 0.0
    std: 0.02
  attention:
    enabled: false
    mode: zero
    resample: fixed

data:
  source: hf
  data_dir: data
  hf_repo: bentrevett/multi30k
  hf_endpoint: https://hf-mirror.com
  src_field: de
  tgt_field: en
  # 0 = no limit: use every available training pair.
  max_train_samples: 0
  max_val_samples: 0
  fallback_to_synthetic: true
  tokenizer: word
  lowercase: true
  min_freq: 2
  max_vocab: 30000
  max_src_len: 0
  max_tgt_len: 0

train:
  optimizer: egd
  batch_size: 64
  epochs: 8
  max_steps: 0
  log_every: 50
  eval_every: 250
  max_eval_batches: 20
  # Score BLEU every ~2 epochs of this schedule (multi30k train is ~29k pairs).
  bleu_every: 2000
  bleu_samples: 200
  save_dir: runs
  run_name: small_multi30k
  seed: 42
  device: auto
  num_workers: 0
  # F0: null means F0 is chosen automatically as initial_loss - auto_F0_margin.
  # A fixed F0 (e.g. 1.0) is safe for cross-entropy because the loss is always
  # positive, but it MUST stay below the smallest loss the model can reach or the
  # update is skipped entirely (the dynamics needs loss - F0 > 0).
  egd:
    # lr is tuned for these small CPU models. The reference implementation's
    # lr=1.0 (a 124M-parameter GPT) diverges at this scale; a 150-step sweep
    # on Multi30k measured a stable window of roughly 0.05 - 0.15 (README 5).
    lr: 0.1
    eta: 100.0
    F0: null
    auto_F0_margin: 1.0
    nu: 0.0
    weight_decay: 0.0
    consEn: true
  adamw:
    lr: 3.0e-4
    betas: [0.9, 0.98]
    eps: 1.0e-8
    weight_decay: 0.01
